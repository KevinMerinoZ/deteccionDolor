{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="{% static 'css/bootstrap/css/bootstrap.min.css' %}"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <link rel="stylesheet" href="{% static 'css/estilos.css' %}" />
    </head>

    <body>

        <section class="card seccion">
            <div class="card-header background-seccion">
                <h3>Iniciar sesión</h3>
            </div>

            <div class="card-body">
                <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">Matricula</label>
                    <input type="text" name="username" id="username" class="form-control" placeholder="abcd123456" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="********" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
                </form>

                <div class="mb-3">
                    <a href="{% url 'inicioSesion:recuperacionContrasena' %}">¿Olvidaste tu contraseña?</a>
                </div>

                {% if messages %}
                <div class="mt-3">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
            </section>
        
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="{% static 'css/bootstrap/js/bootstrap.bundle.min.js' %}"
        ></script>
    </body>
</html>
