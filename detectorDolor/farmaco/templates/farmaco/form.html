<form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}

    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre del fármaco</label>
        {{ form.nombre }}
        {{ form.nombre.errors }}
    </div>

    <div class="mb-3">
        <label for="presentacion" class="form-label">Presentación</label>
        {{ form.presentacion }}
        {{ form.presentacion.errors }}
    </div>

    <div class="mb-3">
        <label for="tipo_farmaco" class="form-label">Tipo de fármaco</label>
        {{ form.tipo_farmaco }}
        {{ form.tipo_farmaco.errors }}
    </div>

    <div class="mb-3">
        <label for="fecha_llegada" class="form-label">Fecha de llegada</label>
        {{ form.fecha_llegada }}
        {{ form.fecha_llegada.errors }}
    </div>

    <div class="mb-3">
        <label for="fecha_abierto" class="form-label">Fecha de apertura</label>
        {{ form.fecha_abierto }}
        {{ form.fecha_abierto.errors }}
    </div>

    <div class="div-footer">
        <button type="submit" class="btnPrimario">Guardar</button>
        <a class="btnSecundario" href="{% url 'farmaco:indexFarmaco' %}" role="button">Cancelar</a>
    </div>

</form>
